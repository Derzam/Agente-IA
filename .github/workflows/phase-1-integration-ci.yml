name: Domain and Integration CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - integration/phase-01-contracts
      - codex/phase-02-backend-foundation
      - antigravity/phase-02-api-adapters
      - integration/phase-02
      - codex/phase-03-domain-schema

permissions:
  contents: read

concurrency:
  group: phase-2-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate backend, admin and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: agente_ia_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agente_ia_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/agente_ia_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Test admin
        run: npm run admin:test

      - name: Build admin
        run: npm run admin:build

      - name: Build API
        run: npm run api:build

      - name: Backend, contract and PostgreSQL RLS tests
        run: npm run api:test

      - name: Audit API production dependencies
        run: npm audit --omit=dev --workspace=@agente-ia/api --audit-level=high

      - name: Check generated OpenAPI
        run: node scripts/build-openapi.mjs --check

      - name: Validate architecture artifacts
        run: node scripts/validate-architecture.mjs

      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD
